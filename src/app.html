<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!-- Theme: matches the resolved theme so mobile browser chrome blends in -->
		<meta name="theme-color" content="#11111b" />
		<meta name="color-scheme" content="dark light" />

		<!-- Resolve theme before first paint (no flash): stored choice, else system. -->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var light = stored
						? stored === 'light'
						: window.matchMedia('(prefers-color-scheme: light)').matches;
					var el = document.documentElement;
					el.classList.toggle('light', light);
					el.classList.toggle('dark', !light);
					var m = document.querySelector('meta[name="theme-color"]');
					if (m) m.setAttribute('content', light ? '#dce0e8' : '#11111b');
				} catch (e) {}
			})();
		</script>

		<!-- Icons -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

		<!-- Feed autodiscovery -->
		<link
			rel="alternate"
			type="application/rss+xml"
			title="Dylan Satow — Blog"
			href="%sveltekit.assets%/rss.xml"
		/>

		<!-- Preload the one render-critical asset: the subset variable font.
		     Discovered immediately instead of after CSS parse → faster first paint. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/jetbrains-mono-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		%sveltekit.body%
	</body>
</html>
