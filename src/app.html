<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Theme: Catppuccin Mocha base, so mobile browser chrome matches the terminal -->
		<meta name="theme-color" content="#11111b" />
		<meta name="color-scheme" content="dark" />

		<!-- Icons -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

		<!-- Preload the one render-critical asset: the subset variable font.
		     Discovered immediately instead of after CSS parse → faster first paint. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/jetbrains-mono-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		%sveltekit.body%
	</body>
</html>
